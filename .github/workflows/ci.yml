name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets aec-upstream.yml run CI on the PR it opens (GITHUB_TOKEN PRs don't trigger pull_request)

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AEC drift check
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/drift_check.py --base "$BASE"
          else
            python3 tools/drift_check.py
          fi
      - name: Install Telosmith (formerly AEC) at the commit pinned in tools/aec_upstream.json
        # Pinned to a commit, not a tag: Telosmith main carries 0.5.0 but v0.5.0 is not tagged yet
        # (docs/integrations/without-spec-kit.md, "Pin gotcha"). Move the pin only through aec-upstream.yml or by hand.
        run: |
          REPO=$(python3 -c "import json;print(json.load(open('tools/aec_upstream.json'))['repo'])")
          COMMIT=$(python3 -c "import json;print(json.load(open('tools/aec_upstream.json'))['commit'])")
          pip install -q "git+${REPO}.git@${COMMIT}"
          python3 -m aec --version
      - name: Structural snapshot (regenerated, never trusted from the branch)
        run: python3 -m aec edges . -o .aec/edges.jsonl
      - name: AEC records check (fails on errors, including dangling code references) and DIO scenarios
        run: |
          python3 -m aec check .aec/records.jsonl --edges .aec/edges.jsonl
          for s in .aec/scenarios/*.jsonl; do python3 -m aec impact .aec/records.jsonl "$s"; done
      - name: Telosmith code-impact against the base (report-only; see the job summary)
        env:
          AEC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$(git merge-base "$AEC_BASE" HEAD 2>/dev/null) || base=""
          if [ -z "$base" ]; then
            echo "code-impact skipped: no base revision for this event" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          python3 -m aec snapshot . --rev "$base" -o .aec/before.jsonl || {
            echo "code-impact skipped: could not snapshot $base" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          report=$(python3 -m aec code-impact .aec/records.jsonl .aec/before.jsonl .aec/edges.jsonl 2>&1) || true
          printf '%s\n' "$report"
          { echo "## Telosmith code-impact (structural, report-only) vs $base"; echo '```'
            printf '%s\n' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Drift check tests
        run: python3 -m unittest discover -s tests -v
      - name: Grammar layer unit tests
        working-directory: grammar
        run: python3 -m unittest tests.py -v
      # KB suite needs the release databases (data/README.md, challenge C-006).
