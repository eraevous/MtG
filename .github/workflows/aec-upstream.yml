# Candidate code never shares a runner or writable filesystem with the publisher.
name: aec-upstream
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: aec-upstream
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      base: ${{ github.sha }}
      moved: ${{ steps.plan.outputs.moved }}
    steps:
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const {owner, repo} = context.repo;
            const file = await github.rest.repos.getContent({owner,repo,path:'tools/aec_upstream.json',ref:context.sha});
            const pin = JSON.parse(Buffer.from(file.data.content,'base64').toString('utf8'));
            if (pin.repo !== 'https://github.com/eraevous/Telosmith' || !/^[a-f0-9]{40}$/.test(pin.commit)) throw Error('Unexpected pin');
            const head = await github.rest.repos.getCommit({owner:'eraevous',repo:'Telosmith',ref:'main'});
            if (!/^[a-f0-9]{40}$/.test(head.data.sha)) throw Error('Invalid upstream SHA');
            core.setOutput('candidate',head.data.sha);
            core.setOutput('moved',String(head.data.sha !== pin.commit));
  check:
    needs: plan
    if: needs.plan.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: eraevous/Telosmith
          ref: ${{ needs.plan.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Check candidate in a disposable container without credentials or network
        run: |
          docker pull python:3.12-slim
          mkdir "$RUNNER_TEMP/aec-input"
          cp -R .aec "$RUNNER_TEMP/aec-input/.aec"
          cp tools/aec_sync.py "$RUNNER_TEMP/aec-input/aec_sync.py"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 --pids-limit 128 \
            --memory 512m --cpus 2 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$RUNNER_TEMP/aec-input:/input:ro" -v "$PWD/candidate/src:/candidate:ro" \
            -w /input python:3.12-slim python -B -c \
            'from pathlib import Path; import aec_sync; r=aec_sync.run_checks(Path("/candidate"),Path("/input")); print(r); raise SystemExit(0 if r and all(x["ok"] for x in r) else 1)'
  publish:
    needs: [plan, check]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.moved == 'true' && contains(fromJSON('["success","failure","cancelled"]'), needs.check.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - name: Publish only a reconstructed pin or failure notice
        uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BASE: ${{ needs.plan.outputs.base }}
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const publish = require('./.github/scripts/aec-publish.cjs');
            await publish({github, context, core});
